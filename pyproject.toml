[project]
name = "advertisement"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Azamat", email = "azamat_azamatov@epam.com"},
]
dependencies = ["uvicorn>=0.34.0", "pymongo>=4.10.1", "fastapi==0.112.0", "pydantic==2.8.2" ]
