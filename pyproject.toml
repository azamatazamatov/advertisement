[project]
name = "advertisement"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Azamat", email = "azamat_azamatov@epam.com"},
]
dependencies = ["uvicorn>=0.34.0", "pymongo>=4.10.1", "fastapi>=0.115.6", "exceptiongroup>=1.2.2", "pytest>=8.3.4", "httpx>=0.28.1"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
